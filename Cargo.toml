[package]
name = "gumdrop"
authors = ["Hunter Wardlaw <wardlawhunter@gmail.com>"]
version = "0.1.0"
edition = "2018"

[dependencies]
color-thief = "0.2.1"
gdk-pixbuf = { version = "0.20", features = ["v2_42"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9.6", package = "gtk4", features = ["v4_16"] }
lofty = "0.22.2"
log = "0.4"
mpris-server = "0.8"
once_cell = "1.10"
pretty_env_logger = "0.5"
rand = { version = "0.9", features = ["thread_rng"]}
regex = "1.3.4"
serde_json = "1.0"
sha2 = "0.10.2"
fuzzy-matcher = "0.3.7"
async-channel = "2.2.0"
futures = "0.3"
rustfm-scrobble = "1.1.1"
rusqlite = "0.35.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.28.0"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = {version = "0.11", default-features = false, features = ["gtk4", "async-std"]}

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_5"]

[dependencies.gst]
package = "gstreamer"
version = "0.23"

[dependencies.gst-audio]
package = "gstreamer-audio"
version = "0.23"

[dependencies.gst-play]
package = "gstreamer-play"
version = "0.23"
